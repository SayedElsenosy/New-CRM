services:
  masar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masar
    restart: unless-stopped
    env_file:
      - ./whatsapp-bot/.env
    environment:
      PORT: 3001
      SESSION_PATH: /data/whatsapp
      DASHBOARD_DIST: /app/admin-dashboard/dist
      NODE_ENV: production
    volumes:
      - masar_whatsapp:/data/whatsapp
    network_mode: host

volumes:
  masar_whatsapp:
