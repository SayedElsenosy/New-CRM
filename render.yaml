services:
  - type: web
    name: masar-whatsapp
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /health
    disk:
      name: whatsapp-session
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
      - key: SESSION_PATH
        value: /data/whatsapp
      - key: NODE_ENV
        value: production
