name: Check project
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build

  python-shadow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python offline shadow agent tests
        working-directory: python-ai-engine
        run: python -m unittest discover -s tests -v
      - name: Python synthetic quality report
        working-directory: python-ai-engine
        run: python -m shadow_ai.evaluate
