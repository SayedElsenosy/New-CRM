name: Check project
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Paired synthetic Node/Python evaluation (report only)
        run: PYTHONPATH=python-ai-engine python -m shadow_ai.paired_eval

  python-shadow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python offline shadow agent tests
        working-directory: python-ai-engine
        run: python -m unittest discover -s tests -v
      - name: Python Free-pilot offline preview (network forbidden)
        working-directory: python-ai-engine
        run: python -m shadow_ai.live_eval --dry-run
      - name: Python synthetic quality report
        working-directory: python-ai-engine
        run: python -m shadow_ai.evaluate
      - name: Python shared-fixture contract
        working-directory: python-ai-engine
        run: python -m shadow_ai.paired_eval --python-only --fail-on-python

  windows-powershell-free-pilot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse using Windows PowerShell 5.1 and reject ambiguous encodings
        shell: powershell
        run: |
          $path = (Resolve-Path 'python-ai-engine/run_free_pilot.ps1').Path
          $script = [System.IO.File]::ReadAllText($path)
          if ($script.ToCharArray() | Where-Object { [int][char]$_ -gt 127 }) {
            throw 'PowerShell pilot must use ASCII-only text for Windows PowerShell 5.1.'
          }
          $tokens = $null
          $issues = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$issues)
          if ($issues.Count -gt 0) {
            throw ('PowerShell parse failed: ' + ($issues | Out-String))
          }
      - name: Execute no-network Windows PowerShell dry run
        shell: powershell
        working-directory: python-ai-engine
        run: |
          .\run_free_pilot.ps1 -DryRun
